
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Background Images</title>
    <link rel="stylesheet" href="login-form-bg-images.css">
</head>
<body>

    <div class="login">
        <img src="img/profile.png" alt="Profile Picture" class="profile">

        <main>
            <h2>Flat Business Profile Widget</h2>

            <form>
                <input type="text" placeholder="Name" class="username">
                <input type="password" placeholder="Password" class="password">
                <button type="submit">Submit</button>
            </form>
        </main>

        <footer>
            © 2016 Flat Business Profile Widget. All rights reserved.
        </footer>
    </div>

</body>
</html>
